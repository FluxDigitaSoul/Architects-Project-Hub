<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="1100" fill="#ffffff"/>
  <!-- cornice -->
  <rect x="30" y="30" width="1540" height="1040" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- pavimenti -->
  <g fill="#f8fafc">
    <rect x="180" y="160" width="560" height="420"/>
    <rect x="740" y="160" width="340" height="420"/>
    <rect x="1080" y="160" width="300" height="300"/>
    <rect x="180" y="580" width="400" height="360"/>
    <rect x="580" y="580" width="220" height="360"/>
    <rect x="800" y="580" width="580" height="360"/>
    <rect x="1080" y="460" width="300" height="120"/>
  </g>
  <g fill="none" stroke="#e2e8f0" stroke-width="1">
