    <rect x="540" y="150" width="120" height="20"/>
    <rect x="840" y="150" width="140" height="20"/>
    <rect x="1170" y="150" width="120" height="20"/>
    <rect x="1370" y="650" width="20" height="160"/>
    <rect x="280" y="930" width="160" height="20"/>
    <rect x="1000" y="930" width="220" height="20"/>
    <rect x="170" y="330" width="20" height="120"/>
