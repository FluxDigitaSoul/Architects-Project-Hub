    <path d="M800 620 H1380 M800 660 H1380 M800 700 H1380 M800 740 H1380 M800 780 H1380 M800 820 H1380 M800 860 H1380 M800 900 H1380"/>
  </g>

  <!-- muri perimetrali -->
