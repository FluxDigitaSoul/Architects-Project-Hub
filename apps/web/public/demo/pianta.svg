  <g stroke="#0f172a" stroke-width="1.5">
    <path d="M300 160 H460 M540 160 H660 M840 160 H980 M1170 160 H1290 M1380 650 V810 M280 940 H440 M1000 940 H1220 M180 330 V450"/>
  </g>

  <!-- porte -->
  <g fill="none" stroke="#475569" stroke-width="2">
    <path d="M740 430 A80 80 0 0 1 820 510"/><path d="M740 430 V510"/>
    <path d="M300 580 A80 80 0 0 0 380 660"/><path d="M380 580 V660"/>
    <path d="M1080 360 A80 80 0 0 0 1000 440"/><path d="M1080 440 H1000"/>
    <path d="M800 760 A80 80 0 0 1 880 840"/><path d="M800 840 H880"/>
    <path d="M660 580 A80 80 0 0 1 740 660"/><path d="M740 580 V660"/>
  </g>

  <!-- arredi schematici -->
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <rect x="240" y="380" width="260" height="110" rx="12"/>
    <rect x="560" y="260" width="120" height="180" rx="6"/>
    <rect x="790" y="210" width="240" height="70"/>
    <rect x="880" y="360" width="160" height="90" rx="8"/>
    <rect x="1130" y="210" width="200" height="200" rx="4"/>
    <rect x="230" y="660" width="220" height="200" rx="4"/>
    <rect x="620" y="640" width="130" height="70" rx="30"/>
    <circle cx="690" cy="840" r="28"/>
    <rect x="950" y="640" width="260" height="220" rx="4"/>
    <rect x="1120" y="490" width="220" height="60" rx="4"/>
  </g>

  <!-- etichette dei vani -->
  <g fill="#0f172a" text-anchor="middle">
    <text x="460" y="300" font-size="30" font-weight="700">SOGGIORNO</text>
    <text x="460" y="336" font-size="22" fill="#475569">Sp 24,50 mq · h 2,90</text>
    <text x="910" y="320" font-size="28" font-weight="700">CUCINA</text>
    <text x="910" y="352" font-size="22" fill="#475569">Sp 11,80 mq</text>
    <text x="1230" y="440" font-size="24" font-weight="700">STUDIO</text>
    <text x="1230" y="530" font-size="20" font-weight="700">DISIMPEGNO</text>
    <text x="380" y="900" font-size="26" font-weight="700">CAMERA 2</text>
    <text x="690" y="760" font-size="24" font-weight="700">BAGNO</text>
    <text x="690" y="790" font-size="20" fill="#475569">5,10 mq · VMC</text>
    <text x="1090" y="900" font-size="28" font-weight="700">CAMERA MATRIMONIALE</text>
    <text x="1090" y="928" font-size="20" fill="#475569">Sp 16,20 mq</text>
  </g>

  <!-- quote -->
  <g stroke="#64748b" stroke-width="1.5" fill="none">
    <path d="M180 110 H1380 M180 100 V120 M740 100 V120 M1080 100 V120 M1380 100 V120"/>
    <path d="M1440 160 V940 M1430 160 H1450 M1430 580 H1450 M1430 940 H1450"/>
