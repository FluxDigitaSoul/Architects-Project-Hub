  <g fill="#64748b" font-size="20" text-anchor="middle">
    <text x="460" y="96">5,60</text><text x="910" y="96">3,40</text><text x="1230" y="96">3,00</text>
    <text x="1480" y="376" transform="rotate(90 1480 376)">4,20</text>
    <text x="1480" y="766" transform="rotate(90 1480 766)">3,60</text>
  </g>

  <!-- nord -->
  <g transform="translate(110 1000)">
    <circle r="30" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M0 -26 L10 10 L0 3 L-10 10 Z" fill="#0f172a"/>
    <text y="-36" text-anchor="middle" font-size="18" font-weight="700">N</text>
  </g>

  <!-- cartiglio -->
  <g transform="translate(1040 980)">
    <rect width="520" height="80" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <path d="M360 0 V80 M0 40 H360" stroke="#0f172a" stroke-width="1"/>
    <text x="14" y="28" font-size="18" font-weight="700">A-101 · PIANTA PIANO PRIMO</text>
    <text x="14" y="66" font-size="15" fill="#475569">Stato di progetto · scala 1:50</text>
    <text x="374" y="30" font-size="15" fill="#475569">Commessa</text>
    <text x="374" y="62" font-size="22" font-weight="700">2026-014</text>
  </g>
