    <path d="M180 580 H300 M380 580 H660 M740 580 H1000"/>
    <path d="M1080 160 V360 M1080 440 V580"/>
    <path d="M1080 460 H1380"/>
    <path d="M580 580 V940"/>
    <path d="M800 580 V760 M800 840 V940"/>
